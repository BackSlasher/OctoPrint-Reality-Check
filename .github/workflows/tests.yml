name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # py_compile parses without importing, so no OctoPrint install needed
      - name: Syntax check
        run: python -m py_compile setup.py octoprint_reality_check/*.py
      # the tests load firmware.py / gcode_meta.py directly (stdlib only)
      - name: Unit tests
        run: python -m unittest discover tests -v
